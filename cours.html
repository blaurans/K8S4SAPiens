<style>
:root{
  --bg:#070b14; --panel:#0e1626; --panel2:#121c30; --line:#1e2a45; --line2:#2a3a5f;

body{background:var(--bg);color:var(--txt);font-family:var(--font);line-height:1.6}

/* ---------- Topbar ---------- */
.topbar{position:sticky;top:0;z-index:10;background:rgba(14,22,38,.92);backdrop-filter:blur(8px);

.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0a6ed1,#3262de);
  display:grid;place-items:center;font-weight:800;color:#fff}

/* callouts */

/* code block */

  border:1px solid var(--line2);border-bottom:0;border-radius:10px 10px 0 0;padding:6px 14px;font-size:12px;color:var(--muted)}

/* tables */

/* quiz */

/* nav bottom */

<script>
/* ================================================================
   COURSE — Kubernetes concepts for SAP administrators
   Block schema:
     {p:"..."}            paragraph
     {lead:"..."}         chapter intro
     {dim:"..."}          side note
     {h:"...", sub:"..."} sub-heading
     {ul:[...]}           bullet list (HTML allowed)
     {tip:"..."} / {warn:"..."} / {map:"..."}   callouts
     {code:"bash", t:"title", src:`...`}        copyable code block
     {tbl:[[headers…], [row…]]}                 table
     {panels:[{cls,h,list:[[term,desc]]}]}      two column panels
     {cards:[{h,t}]} / {cards3:[{h,t}]}         cards
   ================================================================ */
const CHAPTERS = [

/* ---------------- 1 ---------------- */
{ title:"Why Kubernetes?", icon:"🌍", blocks:[
  {lead:"For years you have hosted SAP on servers you pampered like pets. Kubernetes flips the logic: servers become cattle — anonymous, replaceable, rebuilt identically."},
  {h:"What the classic setup looks like", sub:"A traditionally installed 3-tier SAP landscape is:"},
  {ul:[ "<b>ASCS/SCS</b>: the central brain (message server + enqueue) — manual failover or Pacemaker when it breaks",
        "<b>PAS</b>: the primary application server, usually on its own dedicated VM",
        "<b>HANA</b>: the database, with system replication (HSR) + a Pacemaker cluster, SBD, watchdogs…",
        "Hours of manual runbooks for a simple patch: ordered shutdown, backup, upgrade, restart, tests…"]},
  {p:"The orchestrator does what your runbook used to do: place, monitor, restart, move, update — but <b>every few seconds</b>, across hundreds of applications, always the same way."},
  {cards:[
    {h:"Pet → Cattle", t:"A server is no longer unique: losing it is a non-event, the system rebuilds its replacement."},
    {h:"Declarative", t:"You describe the desired state (3 instances, 16 GB, this image). No clicks: the platform converges."},
    {h:"Universal API", t:"Everything that runs is driven through the same API: your runbook becomes versioned code."}]},
  {map:"<b>SAP translation.</b> Pacemaker + failover scripts + admin documentation ≈ kube-scheduler + controller-manager + operators. The difference: Kubernetes also drives storage, networking and secrets — not just services."},
  {tip:"At Airbus, migrating QA (SID TLX) then production (TXP) to Kubernetes does not erase your expertise: about 70% of your Basis reflexes remain valid. This course and the game will translate the rest."}
]},

/* ---------------- 2 ---------------- */
{ title:"Cluster architecture", icon:"🏗️", blocks:[
  {p:"A Kubernetes cluster = a brain (<b>control plane</b>) + muscles (<b>nodes</b>). Just like an SAP landscape: the ASCS decides, the application servers execute."},
  {panels:[
    {cls:"ui", h:"Control plane — the “ASCS of the cluster”", list:[
      ["kube-apiserver","The single front door: HTTPS/REST, authenticates and validates every request. IT is the cluster."],
      ["etcd","The memory (key-value store): the list of pods, config, secrets. Backing up etcd = backing up the cluster."],
      ["kube-scheduler","The placer: decides which node runs each pod (CPU/RAM, affinity, constraints)."],
      ["controller-manager","The reconciliation loops: “actual state ≠ desired state? → correct”. Continuously."]]},
    {cls:"wk", h:"Node — the worker server", list:[
      ["kubelet","The agent: talks to the API, starts containers, runs health checks. Your equivalent of sapstart."],
      ["kube-proxy","Routes network traffic to the pods (iptables/eBPF rules)."],
      ["container runtime","containerd / CRI-O: runs the images. Docker is no longer required."],
      ["addons","CNI (network), CSI (storage), CoreDNS (name resolution), metrics-server."]]}]},
  {warn:"<b>Never SSH into a control-plane node to tinker.</b> You do not hack at the brain: everything goes through the API server, the only component allowed to write to etcd."},
  {code:"bash", t:"Check a cluster's health (every morning's first move)", src:
`# The "SAPGUI" of Kubernetes: one tool, the whole system
kubectl get nodes                     # the servers and their status
kubectl get nodes -o wide             # + version, OS, IP
kubectl top nodes                     # CPU/RAM usage
kubectl describe node <node>          # technical details`},
  {map:"<b>SAP translation.</b> Kubernetes cluster ≈ your entire physical datacenter. Node ≈ one VM host. Control plane ≈ the ASCS + database of the landscape. kubelet ≈ sapstart + sapcontrol."}
]},

/* ---------------- 3 ---------------- */
{ title:"The API and the declarative model", icon:"📜", blocks:[
  {lead:"The founding principle: you do not say “do this”. You describe the <b>desired state</b>, and the cluster keeps it that way — permanently."},
  {h:"A manifest = an ID card", sub:"Every Kubernetes object is YAML with 4 sections:"},
  {code:"yaml", t:"Anatomy of a Kubernetes object", src:
`apiVersion: apps/v1        # which API / generation
kind: Deployment           # the object type
metadata:                  # who is it?
  name: pas-tlx
  namespace: tlx           # the SID it belongs to
  labels:
    app: sap-pas
spec:                      # what I WANT
  replicas: 3              # 3 PAS instances
  selector:
    matchLabels:
      app: sap-pas
  template:
    spec:
      containers:
      - name: pas
        image: registry.airbus.internal/sap/pas:latest`},
  {p:"Your hand-typed commands become <b>files</b>: versioned in Git, reviewable, approved by diff. That is what people call <b>GitOps</b>."},
  {code:"bash", t:"The trio to know", src:
`kubectl apply -f pas.yaml      # declare / update (idempotent)
kubectl get deployments        # check what is running
kubectl delete -f pas.yaml     # remove the object`},
  {tip:"“<code>apply</code>” is <b>idempotent</b>: running the same file 10 times yields the same result. The holy grail of SAP operations — no more “wait, did I already patch this or not?”."},
  {map:"<b>SAP translation.</b> A YAML manifest ≈ your SAP configuration (instance profiles, autologon, table TVARVC) — but outside the instance: versioned, reviewable, testable."}
]},

/* ---------------- 4 ---------------- */
{ title:"Namespaces: your SIDs become perimeters", icon:"📦", blocks:[
  {p:"A <b>namespace</b> = a compartment for names, quotas and rights. At Airbus, one SID = one namespace. Every object of the TLX system lives in <code>tlx</code>."},
  {code:"bash", t:"Moving between SIDs (namespaces)", src:
`kubectl get namespaces                 # the list of SIDs
kubectl get pods -n tlx                # everything running in TLX
kubectl config set-context --current --namespace=tlx   # "log into" TLX`},
  {cards:[
    {h:"Name isolation", t:"The pod <code>pas</code> in namespace <code>tlx</code> and the one in <code>txp</code> coexist without conflict."},
    {h:"Rights isolation (RBAC)", t:"The QA team only accesses <code>tlx</code>; the prod team only <code>txp</code>."},
    {h:"Resource isolation", t:"ResourceQuota: TLX cannot eat TXP's resources."}]},
  {warn:"A namespace isolates <b>objects</b>, not the network or storage by default. A pod in <code>tlx</code> can reach a pod in <code>txp</code> unless an explicit NetworkPolicy forbids it."},
  {map:"<b>SAP translation.</b> Namespace ≈ SID + SAP client + system group, merged into a single concept: <code>namespace tlx</code> ≈ your QA system with its client 100."}
]},

/* ---------------- 5 ---------------- */
{ title:"Pod: the unit of execution", icon:"🫧", blocks:[
  {lead:"The <b>pod</b> is the smallest unit Kubernetes deploys: one or more containers sharing network, ephemeral storage and lifecycle."},
  {cards:[
    {h:"A Pod = an application instance", t:"A PAS instance, a HANA kernel, a log sidecar. A container is NOT an application: a pod sometimes bundles several."},
    {h:"A Pod = mortal", t:"A pod can die at any moment (crash, node failure, update, autoscaling). Never get attached to its name: it contains a random suffix."}]},
  {h:"The 3 health probes", sub:"So the control plane knows whether your application is usable:"},
  {tbl:[["Probe","What it does","SAP example"],
        ["<span class='k8s'>liveness</span>","Is the container stuck? If yes → automatic restart","SAPMMC “process hung” on the dispatcher"],
        ["<span class='k8s'>readiness</span>","Can it take traffic? If not → pulled out of load-balancing, but NOT restarted","ICM not initialized yet: PAS started but not registered at the gateway"],
        ["<span class='k8s'>startup</span>","Grace period at startup before liveness applies","The SAP kernel starts slowly, that is normal"]]},
  {code:"yaml", t:"An SAP pod + sidecar, with probes", src:
`apiVersion: v1
kind: Pod
metadata:
  name: pas-tlx-0
  namespace: tlx
  labels:
    app: sap-pas
spec:
  containers:
  - name: disp-work           # the PAS
    image: sap/pas:7.90
    ports:
    - containerPort: 3200     # dispatcher
    - containerPort: 3300     # gateway
    livenessProbe:
      httpGet: { path: /health, port: 8080 }
    readinessProbe:
      httpGet: { path: /ready, port: 8080 }
  - name: sidecar-logs        # shares the PAS network
    image: fluent-bit:latest`},
  {code:"kubectl", t:"Troubleshooting a pod (the Basis reflex)", src:
`kubectl get pods -n tlx                  # STATUS: Running, CrashLoopBackOff, OOMKilled…
kubectl describe pod pas-tlx-0 -n tlx    # events, reasons, images pulled
kubectl logs pas-tlx-0 -c disp-work -n tlx        # the "dev_disp.log"
kubectl exec -it pas-tlx-0 -n tlx -- bash         # your shell inside
kubectl delete pod pas-tlx-0 -n tlx      # the Deployment creates another one`},
  {warn:"<b>CrashLoopBackOff</b> = your container crashes in a loop. Cause #1 in SAP migrations: kernel/JVM memory footprint &gt; RAM allocated to the pod (check <code>OOMKilled</code> in <code>kubectl describe</code>)."}
]},

/* ---------------- 6 ---------------- */
{ title:"Labels: the cluster's directory", icon:"🏷️", blocks:[
  {p:"A <b>label</b> is a key=value pair stuck on every object. Not decorative at all: it is THE mechanism Kubernetes uses to tie objects together."},
  {cards:[
    {h:"Selection", t:"A Service does not “contain” pods: it watches which pods carry <code>app: sap-pas</code>."},
    {h:"Multi-dimensional", t:"One pod can carry <code>app: pas, sid: tlx, env: qa</code> — filter by any combination."}]},
  {code:"bash", t:"Query like a DBA", src:
`kubectl get pods -n tlx -l app=sap-pas        # all the PAS
kubectl get pods -n tlx -l 'env in (qa,dev)'  # several environments
kubectl get all -n tlx -l sid=tlx             # this SID's objects`},
  {map:"<b>SAP translation.</b> Labels ≈ your structuring logic in <code>T000</code> (the inventory of systems and clients), extended to everything: pods, services, volumes, secrets."}
]},

/* ---------------- 7 ---------------- */
{ title:"Deployment: controlled rollouts", icon:"🚀", blocks:[
  {lead:"A <b>Deployment</b> manages a series of identical pods, rolling updates and a revision history. It replaces your classic maintenance window."},
  {h:"The Deployment + ReplicaSet duo", sub:"The Deployment declares how many replicas; a ReplicaSet keeps exactly N pods alive. Each new version spins up a new ReplicaSet: rollback is instant."},
  {code:"yaml", t:"Deployment with a rolling update", src:
`apiVersion: apps/v1
kind: Deployment
metadata:
  name: pas-tlx
  namespace: tlx
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # may start 1 extra pod during the upgrade
      maxUnavailable: 0    # never fewer than 3 pods available
  selector:
    matchLabels: { app: sap-pas }
  template:
    metadata: { labels: { app: sap-pas } }
    spec:
      containers:
      - name: pas
        image: registry.airbus.prod/sap/pas:7.90-sp3   # ← the update`},
  {code:"bash", t:"The update commands", src:
`kubectl set image deployment/pas-tlx pas=.../pas:7.90-sp4 -n tlx
kubectl rollout status deployment/pas-tlx -n tlx    # watch the rollout
kubectl rollout restart deployment/pas-tlx -n tlx   # clean restart = patch
kubectl rollout undo deployment/pas-tlx -n tlx      # instant rollback`},
  {tip:"“<code>rollout undo</code>” in one second what Pacemaker + snapshot + runbook used to do in 45 minutes."},
  {h:"Horizontal Pod Autoscaler (HPA)", sub:"Like a dynamic resource, but at application level: if average CPU goes over X%, automatically add PAS instances."},
  {map:"<b>SAP translation.</b> Deployment ≈ the notion of horizontally replicable application server instances, driven by the cluster instead of SAPMMC clicks."}
]},

/* ---------------- 8 ---------------- */
{ title:"Service: a stable entry point", icon:"🔀", blocks:[
  {lead:"Pods are born and die, with ephemeral IPs. A <b>Service</b> provides a stable IP + DNS name in front of a group of pods selected by label."},
  {h:"CoreDNS does the magic", sub:"Every service gets a DNS name: <code>pas-gw.tlx.svc.cluster.local</code>. Other pods resolve it natively — no more hosts-file maintenance."},
  {tbl:[["Service type","Concrete equivalent","SAP usage"],
        ["<span class='k8s'>ClusterIP</span>","IP internal to the cluster","ASCS ↔ PAS, HANA ↔ PAS conversations"],
        ["<span class='k8s'>NodePort</span>","Port opened on every node (30xxx)","External debugging, tools that don't speak internal DNS"],
        ["<span class='k8s'>LoadBalancer</span>","Cloud load balancer (OCI), public IP","ICM web front exposed to clients"],
        ["<span class='k8s'>ExternalName</span>","DNS alias","Points to an SAP system still on a VM, during the migration"]]},
  {code:"yaml", t:"Service for the PAS gateway", src:
`apiVersion: v1
kind: Service
metadata:
  name: pas-gw
  namespace: tlx
spec:
  type: ClusterIP                 # invisible from outside: perfect
  selector:
    app: sap-pas                  # ← ALL pods carrying this label
  ports:
  - name: gw
    port: 3300                    # the served port
    targetPort: 3300              # the pod's port`},
  {map:"<b>SAP translation.</b> A ClusterIP Service ≈ naming via the message server (<code>ms/…</code>): a reliable entry point towards potentially moving instances. DNS + an internal load balancer."}
]},

/* ---------------- 9 ---------------- */
{ title:"Ingress: the L7 gateway", icon:"🌐", blocks:[
  {lead:"An <b>Ingress</b> receives external HTTP/HTTPS traffic (through a LoadBalancer) and routes it, by hostname and path, to the right Services. It is your datacenter reverse-proxy, declarative edition."},
  {code:"yaml", t:"Ingress: one URL, one TLS entry point", src:
`apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airbus-sap
  namespace: tlx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt   # automatic certificates
spec:
  tls:
  - hosts: [ sap-tlx.airbus.internal ]
    secretName: sap-tlx-tls
  rules:
  - host: sap-tlx.airbus.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pas-gw
            port: { number: 3300 }`},
  {tip:"This is exactly the role of Caddy on the server hosting this game: terminating HTTPS, routing to the right container. Kubernetes industrializes that pattern at any scale."}
]},

/* ---------------- 10 ---------------- */
{ title:"ConfigMap & Secret: externalized configuration", icon:"🔐", blocks:[
  {lead:"Kubernetes' golden rule: <b>an immutable image</b>. Whatever changes between environments is injected at startup, never hard-coded."},
  {cards:[
    {h:"ConfigMap", t:"Readable config: profile parameters, config files, environment variables. Mounted as variables or a volume."},
    {h:"Secret", t:"Sensitive data: DB passwords, certificates, TLS keys. Base64-encoded (not encrypted!), mounted the same way."}]},
  {code:"bash", t:"Create from the CLI", src:
`kubectl create configmap pas-profile --from-file=DEFAULT.PFL -n tlx
kubectl create secret generic hana-credentials \\
    --from-literal=username=SAPABAP1 \\
    --from-literal=password='Th3Re4lP455w0rd' -n tlx
kubectl get secret hana-credentials -n tlx -o jsonpath='{.data.password}' | base64 -d`},
  {warn:"A <b>Secret is NOT encrypted</b> in etcd without explicit configuration (EncryptionConfiguration). In real Airbus life, valuable secrets live in an external vault (Vault): the Kubernetes Secret only carries a token."}
]},

/* ---------------- 11 ---------------- */
{ title:"StatefulSet: the SAP case par excellence", icon:"🏃", blocks:[
  {lead:"A <b>StatefulSet</b> = a Deployment, but with a <b>fixed and persistent identity</b>: named pods, ordered startup, dedicated storage per replica."},
  {p:"Simple SAP rule: anything with a “personality” (HANA, ASCS/ERS, a single PAS) wants a StatefulSet. Anything anonymous and replicable (web dispatchers, scalable PAS) stays a Deployment."},
  {tbl:[["SAP need","What the StatefulSet brings"],
        ["Each instance keeps a stable name","Pods called <code>hana-0</code>, <code>hana-1</code> — never renamed"],
        ["Control the startup order","HSR: <code>hana-0</code> (primary) starts before <code>hana-1</code> (secondary)"],
        ["Persistent storage per instance","Each replica has ITS OWN PVC, its dedicated volume"],
        ["Reach one specific instance","The “headless” Service lets you hit <code>hana-0.hana.tlx.svc.cluster.local</code>"]]},
  {code:"yaml", t:"StatefulSet for an HSR HANA pair (simplified)", src:
`apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hana
  namespace: tlx
spec:
  serviceName: hana-headless      # headless Service: per-pod DNS
  replicas: 2                     # primary + secondary (HSR)
  selector: { matchLabels: { app: hana } }
  template:
    metadata: { labels: { app: hana } }
    spec:
      affinity:
        podAntiAffinity:          # never both on the same node!
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: { matchLabels: { app: hana } }
            topologyKey: kubernetes.io/hostname
      containers:
      - name: hana
        image: sap/hana:2-sps07
        volumeMounts:
        - { name: data, mountPath: /hana/data }
  volumeClaimTemplates:           # 1 PVC per replica, auto-generated
  - metadata: { name: data }
    spec:
      accessModes: [ ReadWriteOnce ]
      resources: { requests: { storage: 1Ti } }`},
  {map:"<b>SAP translation.</b> StatefulSet ≈ the personality of a named instance. Pacemaker constraints (colocation, order) become <code>podAntiAffinity</code> + <code>podManagementPolicy</code>."}
]},

/* ---------------- 12 ---------------- */
{ title:"Volumes: storage that survives", icon:"💾", blocks:[
  {lead:"A pod's internal storage is ephemeral — anything written outside a persistent volume disappears on restart. Everything that makes up an SAP database must live on a <b>persistent volume</b>."},
  {h:"The three actors", sub:""},
  {cards:[
    {h:"PVC (PersistentVolumeClaim)", t:"The application's request: “I want 1 TB in RWO for HANA”."},
    {h:"PV (PersistentVolume)", t:"The actual resource provided by the cluster, managed by CSI drivers."},
    {h:"StorageClass", t:"The provisioning policy: which storage (OCI disk, NFS, local SSD), which performance, which reclaim rule."}]},
  {code:"yaml", t:"PVC for HANA", src:
`apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: hana-data, namespace: tlx }
spec:
  storageClassName: oci-bv-ultra    # max IOPS, required by HANA
  accessModes: [ ReadWriteOnce ]    # one node at a time
  resources:
    requests: { storage: 1Ti }`},
  {tbl:[["Access mode","Concretely","SAP usage"],
        ["<span class='k8s'>RWO</span> (ReadWriteOnce)","Mounted read-write by 1 single node","Databases (HANA), ASCS filesystem"],
        ["<span class='k8s'>ROX</span> (ReadOnlyMany)","Shared read-only by thousands of pods","Reference files, installation packages"],
        ["<span class='k8s'>RWX</span> (ReadWriteMany)","Shared read-write (NFS-style)","Transport directory <code>/usr/sap/trans</code>, shared logs"]]},
  {tip:"The <code>/usr/sap/trans</code> volume shared between 5 SAP systems is THE classic RWX case: in Kubernetes, a single RWX PVC mounted by every pod involved."}
]},

/* ---------------- 13 ---------------- */
{ title:"RBAC: access control", icon:"🛂", blocks:[
  {lead:"In Kubernetes, everyone is a user or a process. Every action goes through the API server and is checked by <b>RBAC</b> (Role-Based Access Control)."},
  {cards:[
    {h:"Role + RoleBinding", t:"Within a namespace: “the QA team may read and create pods in tlx”."},
    {h:"ClusterRole + ClusterRoleBinding", t:"Cluster-wide: “admins may touch everything, including nodes”."},
    {h:"ServiceAccount", t:"The identity of a <b>pod</b>, not a person. E.g. the Velero backup agent, cert-manager."}]},
  {code:"yaml", t:"Let user Arnaud read only <code>tlx</code>", src:
`apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: qa-readonly, namespace: tlx }
rules:
- apiGroups: [ "" ]
  resources: [ pods, services, deployments ]
  verbs: [ get, list, watch ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: qa-readonly-binding, namespace: tlx }
subjects:
- kind: User
  name: arnaud@airbus.example
roleRef:
  kind: Role
  name: qa-readonly
  apiGroup: rbac.authorization.k8s.io`},
  {map:"<b>SAP translation.</b> RBAC ≈ PFCG (SAP roles and authorizations), but versioned in YAML. A ServiceAccount ≈ a technical system user for internal processes."}
]},

/* ---------------- 14 ---------------- */
{ title:"Resources and scheduling", icon:"⚖️", blocks:[
  {lead:"How much RAM will this PAS use? Which node may it run on? This is the <b>planning</b> side — what Pacemaker did with constraints."},
  {cards:[
    {h:"requests (the promise)", t:"The memory and CPU guaranteed by the scheduler. These are the numbers it uses to pick a node."},
    {h:"limits (the ceiling)", t:"The maximum allowed. Going over the CPU limit throttles your process. Going over the memory limit: the container is killed (OOMKilled)."}]},
  {tbl:[["QoS class","Obtained when","Priority when a node is under pressure"],
        ["<span class='k8s'>Guaranteed</span>","limits == requests on every container","Best protected — HANA, ASCS pods"],
        ["<span class='k8s'>Burstable</span>","requests &lt; limits","PAS, internal tools"],
        ["<span class='k8s'>BestEffort</span>","no requests at all","Absolutely avoid for SAP"]]},
  {h:"Picking a node: affinity, taints, tolerations", sub:""},
  {ul:["<b>nodeSelector</b>: a coarse filter (“this pod wants a node with NVMe SSD”).",
       "<b>podAntiAffinity</b>: never both HANA instances on the same node (HSR).",
       "<b>Taints / Tolerations</b>: a node marked <code>dedicated-sap:NoSchedule</code> rejects every pod without the matching toleration. A properly dedicated SAP cluster."]},
  {code:"yaml", t:"A HANA pod pinned to a dedicated node", src:
`spec:
  nodeSelector:
    workload: sap-hana     # the node carries this label
  tolerations:
  - key: dedicated-sap     # it tolerates the "dedicated-sap" taint
    operator: Exists
    effect: NoSchedule
  resources:
    requests: { memory: "256Gi", cpu: "32" }
    limits:   { memory: "256Gi", cpu: "32" }   # => QoS Guaranteed`},
  {map:"<b>SAP translation.</b> Taint/Toleration ≈ static placement in a Pacemaker cluster. requests/limits ≈ kernel and JVM memory settings, now declared per instance in YAML."}
]},

/* ---------------- 15 ---------------- */
{ title:"Troubleshooting: the field guide", icon:"🔧", blocks:[
  {lead:"The standard debugging procedure, in the right order — like a Basis diagnosis, but closer to the infrastructure."},
  {code:"kubectl", t:"The golden circle", src:
`# 1. The big picture, filtering out suspect pods
kubectl get pods -n tlx | grep -v Running

# 2. Details of a problematic pod
kubectl describe pod bad-pod -n tlx
#    → at the very bottom, the "Events" section tells the truth

# 3. The logs
kubectl logs bad-pod -n tlx --previous       # logs from before the crash!

# 4. The parent objects
kubectl get deployment/statefulset -n tlx

# 5. The node level
kubectl describe node node-3
kubectl top nodes ; kubectl top pods -n tlx

# 6. Namespace events (the cluster's journal)
kubectl get events -n tlx --sort-by=.lastTimestamp`},
  {tbl:[["Pod status","General meaning","The Basis reflex"],
        ["<span class='k8s'>ImagePullBackOff</span>","Non-existent image / unreachable registry / missing auth secret","Check the image tag and registry credentials"],
         ["<span class='k8s'>CrashLoopBackOff</span>","The process runs then dies in a loop","Logs + --previous. Typical SAP config error"],
         ["<span class='k8s'>OOMKilled (137)</span>","Memory limit exceeded","Lower the load or raise <code>limits.memory</code>"],
         ["<span class='k8s'>Pending</span>","The scheduler finds no node (resources, affinity, taint)","<code>describe pod</code> → Events: the reason is written there"],
         ["<span class='k8s'>ContainerCreating</span> (stuck)","Volume / mount that never provisions","Check the PVC, the CSI driver, the node"]]},
  {tip:"The tool <b>K9s</b> (terminal UI) wraps all these views in two keystrokes and becomes the new SAPMMC. Essential."}
]},

{ title:"Wrap-up quiz", icon:"🎓", quiz:true, blocks:[
  {lead:"10 questions, 20 points each: validate what you learned before jumping back into the game."}
]}

/* ================================================================
   Quiz
   ================================================================ */
const QUIZ = [
  {q:"“A PAS pod just crashed” is detected automatically by…",
   o:["The on-call engineer via Grafana","The liveness health probe (if configured)","SAPMMC","The scheduler"],a:1,
   why:"The liveness probe makes the kubelet restart the container — the automatic equivalent of looping “sapcontrol -status”."},
  {q:"Which object guarantees a stable identity for a HANA instance?",
   o:["Deployment","StatefulSet","DaemonSet","Job"],a:1,
   why:"StatefulSet = stable pod names (hana-0, hana-1), persistent storage, predictable ordering."},
  {q:"Other pods in the system must reach the PAS, with zero external exposure. Which object?",
   o:["Ingress","A NodePort Service","A ClusterIP Service","ConfigMap"],a:2,
   why:"ClusterIP: a stable IP inside the cluster + a DNS name. Ingress is for external HTTP traffic."},
  {q:"Your PAS uses 14.8 GB of RAM, its limit is 14 GB. What happens?",
   o:["Nothing","The container is killed (OOMKilled, exit 137)","The system swaps automatically","The orchestrator reduces its load"],a:1,
   why:"Exceeding the memory limit = immediate OOMKill by the kernel. The real memory footprint of the SAP process must be controlled in YAML."},
  {q:"During an image update of a Deployment (3 replicas, maxUnavailable=0)…",
   o:["Kubernetes stops everything then updates","It replaces pods one by one, waiting for each new one to be ready (readiness)","It waits for the next restart","It asks the admin for approval"],a:1,
   why:"RollingUpdate: progressive replacement, keeping service capacity intact."},
  {q:"Where do you store the ABAP connection password to the HANA database?",
   o:["ConfigMap","A Secret (ideally injected from an external vault like Vault)","In clear text in the Deployment YAML","Inside the kernel"],a:1,
   why:"The Secret, injected by an external secret manager: etcd merely encodes it, it does not encrypt it by default."},
  {q:"A pod stays “Pending”. The most likely cause is…",
   o:["An error in the image config","An application crash","The scheduler finds no node satisfying the request (RAM/CPU, affinity, taint)","A network error"],a:2,
   why:"Pending = the scheduler found no acceptable node. <code>describe pod</code> says so explicitly in the Events."},
  {q:"The <code>/usr/sap/trans</code> directory must be shared read-write by pods on several nodes. Which accessMode?",
   o:["ReadWriteOnce (RWO)","ReadOnlyMany (ROX)","ReadWriteMany (RWX)","emptyDir"],a:2,
   why:"RWX (NFS-style): mounted read-write by several nodes at the same time."},
  {q:"A Service finds the pods it routes to thanks to…",
   o:["Their direct IPs","A selector on their labels","Each pod's name","An svc annotation"],a:1,
   why:"A Service is a selector, not a list: any pod carrying the label is automatically included (and stays after rescaling)."},
  {q:"The big paradigm to grasp: you declare…",
   o:["Commands to execute","The desired state, and the system enforces it continuously","Step-by-step procedures","Startup scripts"],a:1,
   why:"That is the core philosophy: declarative state. The control plane reconciles continuously. You no longer “do” — you “describe”."}
];

/* ================================================================
   Rendering
   ================================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function findHTML(b){
  if(b.lead !== undefined) return `<p class="lead">${b.lead}</p>`;
  if(b.p !== undefined)    return `<p>${b.p}</p>`;
  if(b.dim !== undefined)  return `<p class="dim">${b.dim}</p>`;
  if(b.h !== undefined)    return `<h2><span class="anchor">§</span>${b.h}</h2>${b.sub?`<p class="dim">${b.sub}</p>`:""}`;
  if(b.ul)                 return `<ul class="dots">${b.ul.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(b.tip)                return `<div class="callout co-tip"><b>💡 Good to know</b>${b.tip}</div>`;
  if(b.warn)               return `<div class="callout co-warn"><b>⚠️ Watch out</b>${b.warn}</div>`;
  if(b.map)                return `<div class="callout co-map"><b>🔁 SAP translation</b>${b.map}</div>`;
  if(b.code)   return `<div class="codebar"><span>${esc(b.t||"terminal")}</span><button class="copy">📋 copy</button></div><pre>${esc(b.src)}</pre>`;
  if(b.tbl){
    const [head, ...rows] = b.tbl;
    return `<table class="tbl"><thead><tr>${head.map(c=>`<th>${c||""}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??""}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }
  if(b.panels) return `<div class="grid2">${b.panels.map(c=>`<div class="card ${c.cls||""}"><h3>${c.h}</h3><ul class="dots">${c.list.map(([k,v])=>`<li><code>${k}</code> — ${v}</li>`).join("")}</ul></div>`).join("")}</div>`;
  if(b.cards)  return `<div class="grid${b.cards.length===3?"3":"2"}">${b.cards.map(c=>`<div class="card"><h3>${c.h}</h3><p>${c.t}</p></div>`).join("")}</div>`;
  return "";
}

function chapterHTML(i){
  const ch = CHAPTERS[i];
  let body = ch.blocks.map(findHTML).join("");
  if(ch.quiz){
    body += QUIZ.map((q,zi)=>`
      <div class="quiz" data-z="${zi}">
        <div class="q">${zi+1}. ${q.q}</div>
        ${q.o.map((o,oi)=>`<button class="opt" data-o="${oi}">${o}</button>`).join("")}
        <div class="why">💡 ${q.why}</div>
      </div>`).join("");
    body += `<div class="callout co-tip" id="quiz-score" style="display:none"><b>🏆 Result</b><span></span></div>`;
  }
  const nav = `<div class="ch-nav">
    <button id="prev" ${i===0?"disabled":""}>← ${i>0?esc(CHAPTERS[i-1].title):""}</button>
    <button id="next" ${i===CHAPTERS.length-1?"disabled":""}>${i<CHAPTERS.length-1?esc(CHAPTERS[i+1].title):""} →</button>
  </div>`;
  return `<div class="chapter"><p class="kicker">Chapter ${String(i+1).padStart(2,"0")} / ${CHAPTERS.length}</p><h1>${ch.icon} ${ch.title}</h1>${body}${nav}</div>`;
}

/* ----- quiz ----- */
function bindQuiz(){
  let ok = 0, done = 0;
  document.querySelectorAll(".quiz").forEach(box=>{
    const z = +box.dataset.z;
    box.querySelectorAll(".opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(box.dataset.done) return;
        const pick = +btn.dataset.o;
        const correct = QUIZ[z].a;
        box.querySelectorAll(".opt")[correct].classList.add("ok");
        if(pick === correct){ ok++; } else { btn.classList.add("ko"); }
        box.dataset.done = "1";
        box.querySelector(".why").classList.add("show");
        done++;
        if(done === QUIZ.length){
          const pct = Math.round(ok*100/QUIZ.length);
          const s = $("#quiz-score");
          s.style.display = "block";
          s.querySelector("span").innerHTML =
            `${ok} / ${QUIZ.length} (${pct}%) — ` +
            (pct>=80 ? "operational! Jump back into the game, the terminal holds almost no secrets anymore. 🚀"
             : pct>=50 ? "Solid base — reread the chapters you hesitated on via the left-hand menu."
             : "Start with chapters 1 to 5, then come back to this quiz.");
        }
      });
    });
  });
}

/* ----- navigation ----- */
let cur = 0;
function show(i){
  cur = Math.max(0, Math.min(CHAPTERS.length-1, i));
  const c = $("#content");
  c.innerHTML = chapterHTML(cur);
  window.scrollTo({top:0});
  document.querySelectorAll(".toc-item").forEach((el,j)=>el.classList.toggle("active", j===cur));
  bindQuiz();
  c.querySelectorAll("#prev,#next").forEach(b=>{
    b.addEventListener("click",()=>show(b.id==="prev"?cur-1:cur+1));
  });
}

/* ----- table of contents ----- */
$("#toc").innerHTML = CHAPTERS.map((c,i)=>
  `<div class="toc-item" data-i="${i}"><span class="n">${i+1}</span><span>${c.title}</span>${c.quiz?'<span class="qt">quiz</span>':""}</div>`).join("");
$("#toc").addEventListener("click", e=>{
  const it = e.target.closest(".toc-item"); if(it) show(+it.dataset.i);
});
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  if(e.key==="ArrowRight") show(cur+1);
  if(e.key==="ArrowLeft")  show(cur-1);
});

/* ----- search ----- */
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
$("#search").addEventListener("input", e=>{
  const q = norm(e.target.value.trim());
  document.querySelectorAll(".toc-item").forEach((el,i)=>{
    const ch = CHAPTERS[i];
    const hay = norm(ch.title + " " + ch.blocks.map(b=>JSON.stringify(b.h||b.p||b.lead||b.dim||b.tip||b.warn||b.map||b.code||"")).join(" "));
    el.style.display = (!q || hay.includes(q)) ? "" : "none";
    el.classList.toggle("finding", !!q && (hay.includes(q) || hay.includes(norm(ch.title))));
  });
});

/* ----- copy buttons ----- */
document.addEventListener("click", e=>{
  if(!e.target.classList || !e.target.classList.contains("copy")) return;
  const pre = e.target.closest(".codebar").nextElementSibling;
  navigator.clipboard.writeText(pre.textContent).then(()=>{
    e.target.textContent = "✅ copied"; setTimeout(()=>e.target.textContent="📋 copy", 1200);
  });
});

/* init (direct chapter access: ?ch=7) */
const want = new URLSearchParams(location.search).get("ch");
show(want ? Math.min(CHAPTERS.length-1, Math.max(0, +want-1)) : 0);
</script>
