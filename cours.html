<style>
:root{

/* ---------- Topbar ---------- */

  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px}

/* ---------- Layout ---------- */

/* callouts */

/* code block */

/* tables */

/* quiz */
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}

.opt:hover{border-color:var(--kblue)}

.quiz .why{margin-top:10px;font-size:13.5px;color:var(--muted);border-left:3px solid var(--line2);padding-left:12px;display:none}
.quiz .why.show{display:block}

/* nav bottom */
.ch-nav{display:flex;justify-content:space-between;gap:12px;margin-top:44px}

  padding:10px 18px;cursor:pointer;font-size:14px;max-width:48%}
.ch-nav button:hover:enabled{border-color:var(--blue)}

<script>
/* ================================================================
   COURS — Concepts Kubernetes pour administrateurs SAP
   Schéma des blocs :
     {p:"..."}            paragraphe
     {lead:"..."}         chapô
     {dim:"..."}          note en second plan
     {h:"...", sub:"..."} sous-titre
     {ul:[...]}           liste à puces (HTML accepté)
     {tip:"..."} / {warn:"..."} / {map:"..."}   encarts
     {code:"bash", t:"titre", src:`...`}        bloc de code copiable
     {tbl:[[en-têtes…], [ligne…]]}              tableau
     {panels:[{cls,h,list:[[terme,desc]]}]}     2 colonnes papiers
     {cards:[{h,t}]} / {cards3:[{h,t}]}         cartes
   ================================================================ */
const CHAPTERS = [

/* ---------------- 1 ---------------- */
{ title:"Pourquoi Kubernetes ?", icon:"🌍", blocks:[
  {lead:"Pendant des années, vous avez hébergé SAP sur des serveurs que vous choyiez comme des animaux de compagnie. Kubernetes inverse la logique : les serveurs deviennent du bétail — anonymes, remplaçables, reconstruits à l'identique."},
  {h:"Le fonctionnement classique à changer", t:"Un paysage SAP 3-tiers installé à l'ancienne, c'est :"},
  {ul:[ "<b>ASCS/SCS</b> : le cerveau central (message server + enqueue) — bascule manuelle ou Pacemaker en cas de panne",
        "<b>PAS</b> : application server primaire, souvent sur une VM dédiée",
        "<b>HANA</b> : base de données, avec réplication système (HSR) + cluster Pacemaker, SBD, watchdog…",
        "Des heures de runbooks manuels pour un simple patch : stop ordonné, sauvegarde, upgrade, redémarrage, tests…"]},
  {p:"L'orchestrateur fait ce que faisait votre runbook : placer, surveiller, redémarrer, déplacer, mettre à jour — mais <b>toutes les X secondes</b>, sur des centaines d'applications, et toujours de la même manière."},
  {cards:[
    {h:"Pet → Cattle", t:"Un serveur n'est plus unique : sa perte est un non-évènement, le système recrée son remplaçant."},
    {h:"Déclaratif", t:"Vous décrivez l'état désiré (3 instances, 16 Go, cette image). Aucun clic : la plateforme converge."},
    {h:"API universelle", t:"Tout ce qui tourne se pilote par la même API : votre runbook devient du code versionné."}]},
  {map:"<b>Équivalence SAP.</b> Pacemaker + scripts de bascule + documentation d'administration ≈ kube-scheduler + controller-manager + opérateurs. La différence : Kubernetes pilote aussi le stockage, le réseau et les secrets, pas seulement les services."},
  {tip:"Chez Airbus, la migration QA (SID TLX) puis production (TXP) vers Kubernetes ne gomme pas votre expertise : environ 70 % de vos réflexes Basis restent valides. Le reste, ce cours et le jeu vont le traduire."}
]},

/* ---------------- 2 ---------------- */
{ title:"Architecture d'un cluster", icon:"🏗️", blocks:[
  {p:"Un cluster Kubernetes = un cerveau (<b>control plane</b>) + des muscles (<b>nodes</b>). Comme dans un paysage SAP : l'ASCS décide, les application servers exécutent."},
  {panels:[
    {cls:"ui", h:"Control plane — le « ASCS du cluster »", list:[
      ["kube-apiserver","La porte d'entrée unique : HTTPS/REST, authentifie et valide chaque requête. C'est LUI le cluster."],
      ["etcd","La mémoire (base clé-valeur) : liste des pods, config, secrets. Sauvegarder etcd = sauvegarder le cluster."],
      ["kube-scheduler","Le placeur : choisit sur quel node tourne chaque pod (CPU/RAM, affinité, contraintes)."],
      ["controller-manager","Les boucles de réconciliation : « l'état réel ≠ état désiré ? → corriger ». En continu."]]},
    {cls:"wk", h:"Node — le serveur de travail", list:[
      ["kubelet","L'agent : dialogue avec l'API, démarre les conteneurs, applique les health checks. Votre équivalent sapstart."],
      ["kube-proxy","Le routage du trafic réseau vers les pods (règles iptables/eBPF)."],
      ["container runtime","containerd / CRI-O : exécute les images. Docker n'est plus requis."],
      ["addons","CNI (réseau), CSI (stockage), CoreDNS (résolution de noms), metrics-server."]]}]},
  {warn:"<b>Ne jamais SSH sur un node control-plane les mains dans les poches.</b> On ne bricole pas le cerveau : tout passe par l'API server, seul composant autorisé à écrire dans etcd."},
  {code:"bash", t:"Voir l'état d'un cluster (le premier geste de chaque matin)", src:
`# Le « SAPGUI » de Kubernetes : un seul outil, tout le système
kubectl get nodes                     # les serveurs et leur statut
kubectl get nodes -o wide             # + version, OS, IP
kubectl top nodes                     # consommation CPU/RAM
kubectl describe node <node>          # détails techniques`},
  {map:"<b>Équivalence SAP.</b> Cluster Kubernetes ≈ votre datacenter physique entier. Node ≈ un hôte VM. Control plane ≈ ASCS + MDC du paysage. kubelet ≈ sapstart + sapcontrol."}
]},

/* ---------------- 3 ---------------- */
{ title:"L'API et le déclaratif", icon:"📜", blocks:[
  {lead:"Le principe fondateur : vous ne dites pas « fais ceci ». Vous décrivez <b>l'état désiré</b>, et le cluster s'arrange pour s'y tenir — en permanence."},
  {h:"Un manifest = une carte d'identité", t:"Tout objet Kubernetes est du YAML avec 4 sections :"},
  {code:"yaml", t:"Anatomie d'un objet Kubernetes", src:
`apiVersion: apps/v1        # quelle API / génération
kind: Deployment           # le type d'objet
metadata:                  # qui est-il ?
  name: pas-tlx
  namespace: tlx           # le SID auquel il appartient
  labels:
    app: sap-pas
spec:                      # ce que je VEUX
  replicas: 3              # 3 instances du PAS
  selector:
    matchLabels:
      app: sap-pas
  template:
    spec:
      containers:
      - name: pas
        image: registry.airbus.internal/sap/pas:latest`},
  {p:"Vos commandes passées à la main deviennent des <b>fichiers</b> : versionnés dans Git, relisibles, revus par diff. C'est ce qu'on appelle le <b>GitOps</b>."},
  {code:"bash", t:"Le trio à connaître", src:
`kubectl apply -f pas.yaml      # déclarer / mettre à jour (idempotent)
kubectl get deployments        # vérifier ce qui tourne
kubectl delete -f pas.yaml     # retirer l'objet`},
  {tip:"« <code>apply</code> » est <b>idempotent</b> : relancer 10 fois le même fichier donne le même résultat. C'est le Graal de l'exploitation SAP — plus de « attendez, j'ai déjà patché ça, ou pas ? »."},
  {map:"<b>Équivalence SAP.</b> Un manifest YAML ≈ votre paramétrage SAP (profils d'instance, autologon, table TVARVC) — mais en dehors de l'instance : versionné, relisible, testable."}
]},

/* ---------------- 4 ---------------- */
{ title:"Namespaces : vos SIDs deviennent des périmètres", icon:"📦", blocks:[
  {p:"Un <b>namespace</b> = un compartiment de nommage, de quotas et de droits. Chez Airbus, un SID = un namespace. Tous les objets du système TLX vivent dans <code>tlx</code>."},
  {code:"bash", t:"Circuler entre les SIDs (namespaces)", src:
`kubectl get namespaces                 # la liste des SIDs
kubectl get pods -n tlx                # tout ce qui tourne dans TLX
kubectl config set-context --current --namespace=tlx   # se « loger » dans TLX`},
  {cards:[
    {h:"Isolation de noms", t:"Le pod <code>pas</code> du namespace <code>tlx</code> et celui de <code>txp</code> coexistent sans conflit."},
    {h:"Isolation de droits (RBAC)", t:"L'équipe QA n'a accès qu'à <code>tlx</code> ; l'équipe prod qu'à <code>txp</code>."},
    {h:"Isolation de ressources", t:"ResourceQuota : TLX ne peut pas manger les ressources de TXP."}]},
  {warn:"Un namespace isole les <b>objets</b>, pas le réseau ni le stockage par défaut. Un pod de <code>tlx</code> peut joindre un pod de <code>txp</code> sans une politique réseau (NetworkPolicy) explicite."},
  {map:"<b>Équivalence SAP.</b> Namespace ≈ SID + client SAP + cluster système, fusionnés en un seul concept : <code>namespace tlx</code> ≈ votre QA avec son client 100."}
]},

/* ---------------- 5 ---------------- */
{ title:"Pod : l'unité d'exécution", icon:"🫧", blocks:[
  {lead:"Le <b>pod</b> est la plus petite unité que Kubernetes déploie : un ou plusieurs conteneurs qui partagent réseau, stockage éphémère et cycle de vie."},
  {cards:[
    {h:"Un Pod = une instance applicative", t:"Une instance PAS, un kernel HANA, un sidecar de logs. Un conteneur n'est PAS une application : un pod parfois plusieurs les embarquent."},
    {h:"Un Pod = mortel", t:"Un pod peut mourir à tout instant (crash, node en panne, mise à jour, autoscaling). Ne vous attachez jamais à son nom : il contient un identifiant aléatoire."}]},
  {h:"Les 3 sondes de santé", t:"Pour que le control plane sache si votre application est utilisable :"},
  {tbl:[["Sonde","À quoi elle sert","Exemple SAP"],
        ["<span class='k8s'>liveness</span>","Le conteneur est-il bloqué ? Si oui → redémarrage automatique","SAPMMC « process hung » sur le dispatcher"],
        ["<span class='k8s'>readiness</span>","Peut-il accepter du trafic ? Si non → sorti du load-balancing, mais PAS redémarré","ICM pas encore initialisé : PAS démarré mais pas inscrit au gateway"],
        ["<span class='k8s'>startup</span>","Période de grâce au démarrage avant d'appliquer la liveness","Le kernel SAP démarre lentement, c'est normal"]]},
  {code:"yaml", t:"Un pod SAP + sidecar, avec sondes", src:
`apiVersion: v1
kind: Pod
metadata:
  name: pas-tlx-0
  namespace: tlx
  labels:
    app: sap-pas
spec:
  containers:
  - name: disp-work           # le PAS
    image: sap/pas:7.90
    ports:
    - containerPort: 3200     # dispatcher
    - containerPort: 3300     # gateway
    livenessProbe:
      httpGet: { path: /health, port: 8080 }
    readinessProbe:
      httpGet: { path: /ready, port: 8080 }
  - name: sidecar-logs        # partage le même réseau que le PAS
    image: fluent-bit:latest`},
  {code:"kubectl", t:"Dépanner un pod (le réflexe Basis)", src:
`kubectl get pods -n tlx                  # STATUS : Running, CrashLoopBackOff, OOMKilled…
kubectl describe pod pas-tlx-0 -n tlx    # événements, raisons, images tirées
kubectl logs pas-tlx-0 -c disp-work -n tlx        # le « dev_disp.log »
kubectl exec -it pas-tlx-0 -n tlx -- bash         # mode sapdba
kubectl delete pod pas-tlx-0 -n tlx      # le Deployment en recrée un autre`},
  {warn:"<b>CrashLoopBackOff</b> = votre conteneur crashe en boucle. Cause n°1 en migration SAP : consommation mémoire du kernel/JVM &gt; RAM allouée au pod (vérifiez <code>OOMKilled</code> dans <code>kubectl describe</code>)."}
]},

/* ---------------- 6 ---------------- */
{ title:"Labels : l'annuaire du cluster", icon:"🏷️", blocks:[
  {p:"Un <b>label</b> est une paire clé=valeur collée sur chaque objet. Ce n'est PAS décoratif : c'est LE mécanisme par lequel Kubernetes relie les objets entre eux."},
  {cards:[
    {h:"Sélection", t:"Un Service ne « contient » pas les pods : il regarde quels pods portent <code>app: sap-pas</code>."},
    {h:"Multi-dimension", t:"Un pod peut porter <code>app: pas, sid: tlx, env: qa</code> — on le filtre par n'importe quelle combinaison."}]},
  {code:"bash", t:"Requêter comme un DBA", src:
`kubectl get pods -n tlx -l app=sap-pas        # tous les PAS
kubectl get pods -n tlx -l 'env in (qa,dev)'  # plusieurs environnements
kubectl get all -n tlx -l sid=tlx             # les objets de ce SID`},
  {map:"<b>Équivalence SAP.</b> Labels ≈ votre logique de structuration dans <code>T000</code> (inventaire des systèmes et clients), étendue à tout : pods, services, volumes, secrets."}
]},

/* ---------------- 7 ---------------- */
{ title:"Deployment : la mise à jour maîtrisée", icon:"🚀", blocks:[
  {lead:"Le <b>Deployment</b> gère des pods identiques en série, une mise à jour par roulement et un historique de révisions. C'est ce qui remplace votre fenêtre de maintenance classique."},
  {h:"Le duo Deployment + ReplicaSet", t:"Le Deployment déclare combien de répliques ; un ReplicaSet maintient exactement N pods. Chaque nouvelle version crée un ReplicaSet : le retour arrière s'effectue instantanément."},
  {code:"yaml", t:"Deployment avec mise à jour en roulement", src:
`apiVersion: apps/v1
kind: Deployment
metadata:
  name: pas-tlx
  namespace: tlx
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # démarrage possible d'1 pod de plus pendant l'upgrade
      maxUnavailable: 0    # jamais moins de 3 pods disponibles
  selector:
    matchLabels: { app: sap-pas }
  template:
    metadata: { labels: { app: sap-pas } }
    spec:
      containers:
      - name: pas
        image: registry.airbus.prod/sap/pas:7.90-sp3   # ← ici, la mise à jour`},
  {code:"bash", t:"Les commandes de mise à jour", src:
`kubectl set image deployment/pas-tlx pas=.../pas:7.90-sp4 -n tlx
kubectl rollout status deployment/pas-tlx -n tlx    # suivre le roulement
kubectl rollout restart deployment/pas-tlx -n tlx   # redémarrage propre = patch
kubectl rollout undo deployment/pas-tlx -n tlx      # retour arrière immédiat`},
  {tip:"« <code>rollout undo</code> » en une seconde ce que Pacemaker + snapshot + runbook faisaient en 45 minutes."},
  {h:"Horizontal Pod Autoscaler (HPA)", t:"À la manière d'une ressource dynamique, mais au niveau applicatif : si le CPU moyen dépasse X %, ajouter automatiquement des instances du PAS."},
  {map:"<b>Équivalence SAP.</b> Deployment ≈ la notion d'instances app server supplémentaires dans un système réplicables horizontal, piloté par le cluster au lieu du clic SAPMMC."}
]},

/* ---------------- 8 ---------------- */
{ title:"Service : un accès stable aux pods", icon:"🔀", blocks:[
  {lead:"Les pods naissent et meurent, avec des IP éphémères. Le <b>Service</b> donne une IP + un nom DNS stables, face à un groupe de pods sélectionnés par label."},
  {h:"Le CoreDNS fait le magicien", t:"Chaque service aura un nom DNS : <code>pas-gw.tlx.svc.cluster.local</code>. Les autres pods le résolvent nativement — plus de maintenance de fichiers hosts."},
  {tbl:[["Type d'un Service","Équivalent concret","Usage SAP"],
        ["<span class='k8s'>ClusterIP</span>","IP interne au cluster","Conversation ASCS ↔ PAS, HANA ↔ PAS"],
        ["<span class='k8s'>NodePort</span>","Port ouvert sur chaque node (30xxx)","Debug externe, outil qui ne comprend pas le DNS interne"],
        ["<span class='k8s'>LoadBalancer</span>","Load-balancer cloud (OCI), IP publique","Front web ICM exposé aux clients"],

kind: StatefulSet
metadata:
  name: hana
  namespace: tlx
spec:
  serviceName: hana-headless      # Service headless : DNS par pod
  replicas: 2                     # primaire + secondaire (HSR)
  selector: { matchLabels: { app: hana } }

    metadata: { labels: { app: hana } }

        - { name: data, mountPath: /hana/data }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function findHTML(b){
  if(b.lead !== undefined) return `<p class="lead">${b.lead}</p>`;
  if(b.p !== undefined)    return `<p>${b.p}</p>`;
  if(b.dim !== undefined)  return `<p class="dim">${b.dim}</p>`;
  if(b.h !== undefined)    return `<h2><span class="anchor">§</span>${b.h}</h2>${b.sub?`<p class="dim">${b.sub}</p>`:""}`;
  if(b.ul)                 return `<ul class="dots">${b.ul.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(b.tip)                return `<div class="callout co-tip"><b>💡 Bon à savoir</b>${b.tip}</div>`;
  if(b.warn)               return `<div class="callout co-warn"><b>⚠️ Attention</b>${b.warn}</div>`;
  if(b.map)                return `<div class="callout co-map"><b>🔁 Traduction SAP</b>${b.map}</div>`;
  if(b.code)   return `<div class="codebar"><span>${esc(b.t||"terminal")}</span><button class="copy">📋 copier</button></div><pre>${esc(b.src)}</pre>`;
  if(b.tbl){
    const [head, ...rows] = b.tbl;
    return `<table class="tbl"><thead><tr>${head.map(c=>`<th>${c||""}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??""}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }
  if(b.panels) return `<div class="grid2">${b.panels.map(c=>`<div class="card ${c.cls||""}"><h3>${c.h}</h3><ul class="dots">${c.list.map(([k,v])=>`<li><code>${k}</code> — ${v}</li>`).join("")}</ul></div>`).join("")}</div>`;
  if(b.cards)  return `<div class="grid${b.cards.length===3?"3":"2"}">${b.cards.map(c=>`<div class="card"><h3>${c.h}</h3><p>${c.t}</p></div>`).join("")}</div>`;
  return "";
}

function chapterHTML(i){
  const ch = CHAPTERS[i];
  let body = ch.blocks.map(findHTML).join("");
  if(ch.quiz){
    body += QUIZ.map((q,zi)=>`
      <div class="quiz" data-z="${zi}">
        <div class="q">${zi+1}. ${q.q}</div>
        ${q.o.map((o,oi)=>`<button class="opt" data-o="${oi}">${o}</button>`).join("")}
        <div class="why">💡 ${q.why}</div>
      </div>`).join("");
    body += `<div class="callout co-tip" id="quiz-score" style="display:none"><b>🏆 Résultat</b><span></span></div>`;
  }
  const nav = `<div class="ch-nav">
    <button id="prev" ${i===0?"disabled":""}>← ${i>0?esc(CHAPTERS[i-1].title):""}</button>
    <button id="next" ${i===CHAPTERS.length-1?"disabled":""}>${i<CHAPTERS.length-1?esc(CHAPTERS[i+1].title):""} →</button>
  </div>`;
  return `<div class="chapter"><p class="kicker">Chapitre ${String(i+1).padStart(2,"0")} / ${CHAPTERS.length}</p><h1>${ch.icon} ${ch.title}</h1>${body}${nav}</div>`;
}

/* ----- quiz ----- */
function bindQuiz(){
  let ok = 0, done = 0;
  document.querySelectorAll(".quiz").forEach(box=>{
    const z = +box.dataset.z;
    box.querySelectorAll(".opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(box.dataset.done) return;
        const pick = +btn.dataset.o;
        const correct = QUIZ[z].a;
        box.querySelectorAll(".opt")[correct].classList.add("ok");
        if(pick === correct){ ok++; } else { btn.classList.add("ko"); }
        box.dataset.done = "1";
        box.querySelector(".why").classList.add("show");
        done++;
        if(done === QUIZ.length){
          const pct = Math.round(ok*100/QUIZ.length);
          const s = $("#quiz-score");
          s.style.display = "block";
          s.querySelector("span").innerHTML =
            `${ok} / ${QUIZ.length} (${pct}%) — ` +
            (pct>=80 ? "opérationnel ! Reprenez le jeu, le terminal n'aura presque plus de secrets. 🚀"
             : pct>=50 ? "Bonne base — relisez les chapitres où vous hésitez via le sommaire de gauche."
             : "Commencez par les chapitres 1 à 5, puis revenez à ce quiz.");
        }
      });
    });
  });
}

/* ----- navigation ----- */
let cur = 0;
function show(i){
  cur = Math.max(0, Math.min(CHAPTERS.length-1, i));
  const c = $("#content");
  c.innerHTML = chapterHTML(cur);
  window.scrollTo({top:0});
  document.querySelectorAll(".toc-item").forEach((el,j)=>el.classList.toggle("active", j===cur));
  bindQuiz();
  c.querySelectorAll("#prev,#next").forEach(b=>{
    b.addEventListener("click",()=>show(b.id==="prev"?cur-1:cur+1));
  });
}

/* ----- sommaire ----- */
$("#toc").innerHTML = CHAPTERS.map((c,i)=>
  `<div class="toc-item" data-i="${i}"><span class="n">${i+1}</span><span>${c.title}</span>${c.quiz?'<span class="qt">quiz</span>':""}</div>`).join("");
$("#toc").addEventListener("click", e=>{
  const it = e.target.closest(".toc-item"); if(it) show(+it.dataset.i);
});
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  if(e.key==="ArrowRight") show(cur+1);
  if(e.key==="ArrowLeft")  show(cur-1);
});

/* ----- recherche ----- */
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
$("#search").addEventListener("input", e=>{
  const q = norm(e.target.value.trim());
  document.querySelectorAll(".toc-item").forEach((el,i)=>{
    const ch = CHAPTERS[i];
    const hay = norm(ch.title + " " + ch.blocks.map(b=>JSON.stringify(b.h||b.p||b.lead||b.dim||b.tip||b.warn||b.map||b.code||"")).join(" "));
    el.style.display = (!q || hay.includes(q)) ? "" : "none";
    el.classList.toggle("finding", !!q && (hay.includes(q) || hay.includes(norm(ch.title))));
  });
});

/* ----- boutons copier ----- */
document.addEventListener("click", e=>{
  if(!e.target.classList || !e.target.classList.contains("copy")) return;
  const pre = e.target.closest(".codebar").nextElementSibling;
  navigator.clipboard.writeText(pre.textContent).then(()=>{
    e.target.textContent = "✅ copié"; setTimeout(()=>e.target.textContent="📋 copier", 1200);
  });
});

/* init (accès direct à un chapitre : ?ch=7) */
const want = new URLSearchParams(location.search).get("ch");
show(want ? Math.min(CHAPTERS.length-1, Math.max(0, +want-1)) : 0);
</script>
</body>
